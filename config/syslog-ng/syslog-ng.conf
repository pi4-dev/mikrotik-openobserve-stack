@version: 4.5
@include "scl.conf"

# Docker Compose passes OPENOBSERVE_USER, OPENOBSERVE_PASSWORD and
# OPENOBSERVE_ORG as environment variables. syslog-ng imports host/container
# environment variables as global configuration variables, referenced below
# with backticks.

options {
    keep-hostname(yes);
    chain-hostnames(no);
    use-dns(no);
    stats(freq(0));
};

# -----------------------------------------------------------------------------
# MikroTik DNS logger
# -----------------------------------------------------------------------------
# RouterOS sends BSD/IETF-compatible syslog over UDP/5514.
source s_mikrotik_syslog {
    syslog(
        ip("0.0.0.0")
        port(5514)
        transport("udp")
    );
};

# The RouterOS logging rule uses topics=dns,!packet and severity=notice.
# We keep only the compact query line, e.g.:
#   query from 10.254.249.10: #8630451 static.cloudflareinsights.com. A
#
# PROGRAM=dns and LEVEL=notice match the current RouterOS/syslog-ng format.
filter f_mikrotik_dns_query {
    program("dns")
    and level(notice)
    and match("^query from " value("MESSAGE") type("pcre"));
};

# Send explicit lowercase field names because the OpenObserve VRL functions
# in this repository expect .message, and dashboards commonly use host,
# program and priority.
destination d_openobserve_dns {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("`OPENOBSERVE_ORG`")
        stream("dnslog")
        user("`OPENOBSERVE_USER`")
        password("`OPENOBSERVE_PASSWORD`")
        record("--scope none --pair host=\"${HOST}\" --pair program=\"${PROGRAM}\" --pair priority=\"${LEVEL}\" --pair facility=\"${FACILITY}\" --pair message=\"${MESSAGE}\" --pair source_ip=\"${SOURCEIP}\" --pair _timestamp=\"${ISODATE}\"")
        workers(2)
        batch-lines(100)
        batch-timeout(1000)
    );
};

log {
    source(s_mikrotik_syslog);
    filter(f_mikrotik_dns_query);
    destination(d_openobserve_dns);
    flags(flow-control);
};

# -----------------------------------------------------------------------------
# GoFlow2 NetFlow v9 JSON
# -----------------------------------------------------------------------------
# GoFlow2 writes one JSON record per line to a shared Docker volume.
source s_goflow2_file {
    file(
        "/var/log/goflow2/flows.log"
        follow-freq(1)
        flags(no-parse)
    );
};

# GoFlow2 field names are lowercase and do not collide with the usual
# uppercase syslog macros, so no prefix is required. Type information from the
# JSON record is preserved by syslog-ng 4.x.
parser p_goflow2_json {
    json-parser(prefix(""));
};

destination d_openobserve_netflow {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("`OPENOBSERVE_ORG`")
        stream("netflow")
        user("`OPENOBSERVE_USER`")
        password("`OPENOBSERVE_PASSWORD`")
        record("--scope nv-pairs --pair collector=\"goflow2\"")
        workers(2)
        batch-lines(250)
        batch-timeout(1000)
    );
};

log {
    source(s_goflow2_file);
    parser(p_goflow2_json);
    destination(d_openobserve_netflow);
    flags(flow-control);
};
