@version: 4.12
@include "scl.conf"

# Docker Compose passes OPENOBSERVE_USER, OPENOBSERVE_PASSWORD and
# OPENOBSERVE_ORG as environment variables. syslog-ng imports container
# environment variables as global configuration variables, referenced below
# with backticks.

options {
    keep-hostname(yes);
    chain-hostnames(no);
    use-dns(no);
    stats(freq(0));
};

# -----------------------------------------------------------------------------
# MikroTik DNS logger
# -----------------------------------------------------------------------------
# RouterOS sends syslog over UDP/5514. The router already filters to compact
# DNS query events; the syslog-ng filter below is deliberately defensive.
source s_mikrotik_syslog {
    syslog(
        ip("0.0.0.0")
        port(5514)
        transport("udp")
    );
};

# Expected MESSAGE example:
#   query from 10.254.249.10: #8630451 static.cloudflareinsights.com. A
filter f_mikrotik_dns_query {
    program("dns")
    and level(notice)
    and match("^query from " value("MESSAGE") type("pcre"));
};

# Send explicit lowercase field names because the OpenObserve VRL functions
# expect .message, and dashboards use host/program/priority consistently.
destination d_openobserve_dns {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("`OPENOBSERVE_ORG`")
        stream("dnslog")
        user("`OPENOBSERVE_USER`")
        password("`OPENOBSERVE_PASSWORD`")
        record("--scope none --pair host=\"${HOST}\" --pair program=\"${PROGRAM}\" --pair priority=\"${LEVEL}\" --pair facility=\"${FACILITY}\" --pair message=\"${MESSAGE}\" --pair source_ip=\"${SOURCEIP}\" --pair _timestamp=\"${ISODATE}\"")
        workers(2)
        batch-lines(100)
        batch-timeout(1000)
    );
};

log {
    source(s_mikrotik_syslog);
    filter(f_mikrotik_dns_query);
    destination(d_openobserve_dns);
    flags(flow-control);
};

# -----------------------------------------------------------------------------
# GoFlow2 NetFlow v9 JSON
# -----------------------------------------------------------------------------
# GoFlow2 writes newline-delimited JSON to a FIFO created by the one-shot
# goflow-pipe-init service. Using a FIFO avoids a continuously growing
# intermediate flows.log file and the need for log rotation.
source s_goflow2_pipe {
    pipe(
        "/run/goflow2/flows.pipe"
        flags(no-parse)
    );
};

# GoFlow2's default formatter emits JSON. Parse every line into structured
# name-value pairs before forwarding it to OpenObserve.
parser p_goflow2_json {
    json-parser(prefix(""));
};

destination d_openobserve_netflow {
    openobserve-log(
        url("http://openobserve")
        port(5080)
        organization("`OPENOBSERVE_ORG`")
        stream("netflow")
        user("`OPENOBSERVE_USER`")
        password("`OPENOBSERVE_PASSWORD`")
        record("--scope nv-pairs --pair collector=\"goflow2\"")
        workers(2)
        batch-lines(250)
        batch-timeout(1000)
    );
};

log {
    source(s_goflow2_pipe);
    parser(p_goflow2_json);
    destination(d_openobserve_netflow);
    flags(flow-control);
};
