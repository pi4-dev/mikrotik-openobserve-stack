services:
  openobserve:
    image: openobserve/openobserve:${OPENOBSERVE_VERSION:-v0.92.2}
    container_name: openobserve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD}

      # MaxMind GeoLite support used by openobserve/functions/netflow_geoip.vrl.
      # OpenObserve disables automatic MMDB download by default, so this stack
      # explicitly enables it and keeps the databases on the persistent /data
      # bind mount.
      ZO_MMDB_DISABLE_DOWNLOAD: ${ZO_MMDB_DISABLE_DOWNLOAD:-false}
      ZO_MMDB_DATA_DIR: ${ZO_MMDB_DATA_DIR:-/data/mmdb}
      ZO_MMDB_UPDATE_DURATION_DAYS: ${ZO_MMDB_UPDATE_DURATION_DAYS:-30}
      ZO_MMDB_GEOLITE_CITYDB_URL: ${ZO_MMDB_GEOLITE_CITYDB_URL:-https://geoip.zinclabs.dev/GeoLite2-City.mmdb}
      ZO_MMDB_GEOLITE_ASNDB_URL: ${ZO_MMDB_GEOLITE_ASNDB_URL:-https://geoip.zinclabs.dev/GeoLite2-ASN.mmdb}
      ZO_MMDB_GEOLITE_CITYDB_SHA256_URL: ${ZO_MMDB_GEOLITE_CITYDB_SHA256_URL:-https://geoip.zinclabs.dev/GeoLite2-City.sha256}
      ZO_MMDB_GEOLITE_ASNDB_SHA256_URL: ${ZO_MMDB_GEOLITE_ASNDB_SHA256_URL:-https://geoip.zinclabs.dev/GeoLite2-ASN.sha256}
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080/tcp"
    volumes:
      - ./data/openobserve:/data
    networks:
      - observability

  # One-shot initializer for the GoFlow2 -> syslog-ng FIFO.
  # It is expected to finish with exit code 0 after creating the named pipe.
  goflow-pipe-init:
    image: alpine:${ALPINE_VERSION:-3.23}
    container_name: goflow-pipe-init
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        pipe=/run/goflow2/flows.pipe
        if [ -e "$pipe" ] && [ ! -p "$pipe" ]; then
          rm -f "$pipe"
        fi
        if [ ! -p "$pipe" ]; then
          mkfifo "$pipe"
        fi
        chmod 0666 "$pipe"
    volumes:
      - goflow-pipe:/run/goflow2

  goflow2:
    # GoFlow2 Docker Hub does not publish release-number tags such as v2.2.6.
    # 2d10ea3 is a published multi-arch immutable commit tag from the v2 branch.
    image: netsampler/goflow2:${GOFLOW2_TAG:-2d10ea3}
    container_name: goflow2
    restart: unless-stopped
    depends_on:
      goflow-pipe-init:
        condition: service_completed_successfully
    command:
      - -listen
      - netflow://:2055
      - -transport.file
      - /run/goflow2/flows.pipe
    ports:
      - "${NETFLOW_PORT:-2055}:2055/udp"
    volumes:
      - goflow-pipe:/run/goflow2
    networks:
      - observability

  syslog-ng:
    image: balabit/syslog-ng:${SYSLOG_NG_VERSION:-4.12.0}
    container_name: syslog-ng
    restart: unless-stopped
    depends_on:
      openobserve:
        condition: service_started
      goflow-pipe-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
    ports:
      - "${SYSLOG_PORT:-5514}:5514/udp"
    volumes:
      - ./config/syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - goflow-pipe:/run/goflow2
    networks:
      - observability

volumes:
  goflow-pipe:

networks:
  observability:
    driver: bridge
